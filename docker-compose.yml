services:
  mongodb:
    image: mongo:7
    container_name: fx-mongodb
    restart: unless-stopped
    # No host port binding: Mongo is internal-only. Reach it via
    # `docker compose exec mongodb mongosh` — an unauthenticated 0.0.0.0:27017
    # on the host is a full compromise of the trading database.
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fx-redis
    restart: unless-stopped
    # Internal-only (see mongodb note). Set REDIS_PASSWORD to enable auth.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-fx-redis-dev}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-fx-redis-dev}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: fx-backend
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # PRODUCTION hardening in the default path (CSP on, 300 req/min limit).
      # Use docker-compose.override.yml for a development profile.
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MONGODB_URI: mongodb://mongodb:27017/fxintel
      REDIS_URL: redis://:${REDIS_PASSWORD:-fx-redis-dev}@redis:6379
      # JWT_SECRET has NO default: the backend fails fast on missing/weak
      # secrets in production instead of signing with a source-visible value.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong random value}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-YAHOO}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-RSS}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      ECONOMIC_CALENDAR_PROVIDER: ${ECONOMIC_CALENDAR_PROVIDER:-CENTRALBANK}
      ECONOMIC_CALENDAR_API_KEY: ${ECONOMIC_CALENDAR_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PYTHON_AI_URL: http://ai-engine:8500
      ALLOW_SIGNALS_WITHOUT_ML: "false"
      ALLOW_DEMO_SIGNALS: "false"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  ai-engine:
    build:
      context: .
      dockerfile: docker/ai-engine.Dockerfile
    container_name: fx-ai-engine
    restart: unless-stopped
    user: "1001:1001"
    volumes:
      - ai-models:/app/models
    expose:
      - "8500"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8500
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8500/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_TARGET: http://backend:4000
    container_name: fx-frontend
    restart: unless-stopped
    user: "1001:1001"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:4173"
    # Serve the BUILT app (vite preview) — running the dev server in compose
    # exposed HMR websockets and source-transformed modules as the prod face.

volumes:
  mongo-data:
  ai-models:
