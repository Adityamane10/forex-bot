<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX Intel — Real-Time Forex Intelligence &amp; Paper Trading</title>
    <meta name="description" content="AI/ML forex market intelligence, signal generation, backtesting and paper trading. Educational use only — not financial advice." />
    <meta name="theme-color" content="#0A0A09" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Typography: "Instrument Sans" carries labels and prose; "IBM Plex Mono"
      carries every number, with tabular figures so live prices stop jittering
      as digits change width. Both were previously declared in the Tailwind
      config but never actually loaded, so the app rendered in system fallbacks.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
